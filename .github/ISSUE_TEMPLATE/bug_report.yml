name: Bug report
description: Report a reproducible QuizForge defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve QuizForge. Do not post credentials, private user data, signing material, or unpatched vulnerability details here. Security reports belong in SECURITY.md.

  - type: input
    id: version
    attributes:
      label: QuizForge version or commit
      description: Release version, tag, or commit SHA.
      placeholder: v0.1.0 or abc1234
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
        - Windows
        - macOS
        - Linux
        - Multiple platforms
    validations:
      required: true

  - type: input
    id: flutter
    attributes:
      label: Flutter version
      description: Output version from `flutter --version`.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove secrets and personal data before attaching logs or images.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
