name: Materialize Platform Runners

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-platform-runners.yml

permissions:
  contents: write

jobs:
  materialize:
    name: Generate and commit platform projects
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure requested Git identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render canonical 1024px brand image
        run: |
          mkdir -p assets/branding
          rsvg-convert assets/branding/quizforge_logo.svg \
            --width 1024 --height 1024 \
            --output assets/branding/quizforge_logo_1024.png

      - name: Normalize package metadata and generator dependencies
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          text = path.read_text(encoding="utf-8")
          if re.search(r"^  intl:\s*.*$", text, flags=re.MULTILINE):
              text = re.sub(r"^  intl:\s*.*$", "  intl: any", text, flags=re.MULTILINE)
          else:
              marker = "  flutter_localizations:\n    sdk: flutter\n"
              if marker in text:
                  text = text.replace(marker, marker + "  intl: any\n", 1)
          path.write_text(text, encoding="utf-8")

      - name: Add pinned-compatible branding generators
        run: |
          flutter pub add --dev flutter_launcher_icons
          flutter pub add --dev flutter_native_splash

      - name: Materialize all Flutter platform runners
        run: |
          flutter create . \
            --org com.sanskarin \
            --project-name quizforge \
            --platforms=android,ios,web,windows,macos,linux

      - name: Restore QuizForge-facing platform labels
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "android/app/src/main/AndroidManifest.xml": [
                  ('android:label="quizforge"', 'android:label="QuizForge"'),
              ],
              "ios/Runner/Info.plist": [
                  ("<string>Quizforge</string>", "<string>QuizForge</string>"),
              ],
              "macos/Runner/Configs/AppInfo.xcconfig": [
                  ("PRODUCT_NAME = quizforge", "PRODUCT_NAME = QuizForge"),
              ],
              "windows/runner/main.cpp": [
                  ('L"quizforge"', 'L"QuizForge"'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

      - name: Write icon and splash generator configuration
        shell: bash
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: true
            image_path: assets/branding/quizforge_logo_1024.png
            remove_alpha_ios: true
            adaptive_icon_background: "#F7F2FA"
            adaptive_icon_foreground: assets/branding/quizforge_logo_1024.png
            web:
              generate: true
              image_path: assets/branding/quizforge_logo_1024.png
              background_color: "#F7F2FA"
              theme_color: "#6750A4"
            windows:
              generate: true
              image_path: assets/branding/quizforge_logo_1024.png
              icon_size: 256
            macos:
              generate: true
              image_path: assets/branding/quizforge_logo_1024.png
          EOF

          cat > flutter_native_splash.yaml <<'EOF'
          flutter_native_splash:
            color: "#F7F2FA"
            color_dark: "#1D1B20"
            image: assets/branding/quizforge_logo_1024.png
            android: true
            ios: true
            web: true
            android_12:
              color: "#F7F2FA"
              color_dark: "#1D1B20"
              image: assets/branding/quizforge_logo_1024.png
          EOF

      - name: Generate platform launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash assets
        run: dart run flutter_native_splash:create

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format source and tests
        run: dart format lib test tool

      - name: Run source quality gate
        run: |
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test --coverage

      - name: Build Android debug and Web release smoke artifacts
        run: |
          flutter build apk --debug
          flutter build web --release

      - name: Commit generated platform projects and branding assets
        shell: bash
        run: |
          set -euo pipefail
          git add \
            pubspec.yaml pubspec.lock \
            android ios web windows macos linux \
            assets/branding/quizforge_logo_1024.png \
            flutter_launcher_icons.yaml flutter_native_splash.yaml \
            lib test tool
          if ! git diff --cached --quiet; then
            git commit -m "build: materialize branded Flutter platform runners"
          fi

      - name: Record platform-runner generation details
        shell: bash
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > docs/platform-runners.md <<EOF
          # Platform Runners

          QuizForge tracks generated platform projects for Android, iOS, Web, Windows, macOS, and Linux so a clean clone contains the platform integration files required by normal Flutter tooling.

          They were materialized from the repository package with the organization id \`com.sanskarin\` and project name \`quizforge\`.

          The project also tracks generated launcher-icon and native-splash outputs based on the editable source artwork in \`assets/branding/\`.

          Generation workflow: ${RUN_URL}

          ## Regeneration

          When a Flutter upgrade requires runner regeneration, use the documented Flutter version and review the diff carefully:

          \`\`\`bash
          flutter create . --org com.sanskarin --project-name quizforge --platforms=android,ios,web,windows,macos,linux
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter gen-l10n
          \`\`\`

          Never accept runner regeneration as a blind overwrite. Re-run analysis/tests/build checks and inspect application ids, display names, permissions, entitlements, signing placeholders, generated assets, and release configuration.

          **Made by the Sanskar**
          EOF

          if ! grep -q "Tracked platform runner update" what_changed.md; then
            cat >> what_changed.md <<EOF

          ## Tracked platform runner update — 2026-08-19

          Workflow: ${RUN_URL}

          Android, iOS, Web, Windows, macOS, and Linux Flutter runner projects were materialized and tracked using organization id \`com.sanskarin\`. A 1024px canonical brand raster was generated from the editable SVG source, launcher icons were generated for supported targets, and Android/iOS/Web native splash assets were generated from tracked branding configuration. Source analysis/tests plus Android debug and Web release build smoke checks ran before the platform commit was pushed.

          Generated platform commits use Git identity \`Sanskar <sanskarin@outlook.in>\`.
          EOF
          fi

          git add docs/platform-runners.md what_changed.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: document tracked platform runners"
          fi

      - name: Rebase onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Push verified platform commits
        run: git push origin HEAD:main
