name: Platform Build Matrix

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'l10n.yaml'
      - 'tool/generate_platform_branding.py'
      - 'tool/test_generate_platform_branding.py'
      - 'linux/**'
      - 'windows/**'
      - 'macos/**'
      - 'ios/**'
      - '.github/workflows/platform-builds.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'l10n.yaml'
      - 'tool/generate_platform_branding.py'
      - 'tool/test_generate_platform_branding.py'
      - 'linux/**'
      - 'windows/**'
      - 'macos/**'
      - 'ios/**'
      - '.github/workflows/platform-builds.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux release build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Enable and materialize Linux runner
        run: |
          flutter config --enable-linux-desktop
          flutter create . --platforms=linux
      - name: Apply QuizForge Linux branding
        run: |
          python3 tool/generate_platform_branding.py --platforms=linux
          python3 tool/generate_platform_branding.py --platforms=linux --check
      - name: Resolve locked dependencies and localizations
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock analysis_options.yaml
          flutter gen-l10n
      - name: Build Linux release bundle
        run: flutter build linux --release

  windows:
    name: Windows release build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Enable and materialize Windows runner
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows
      - name: Apply QuizForge Windows branding
        shell: pwsh
        run: |
          python tool/generate_platform_branding.py --platforms=windows
          python tool/generate_platform_branding.py --platforms=windows --check
      - name: Resolve locked dependencies and localizations
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock analysis_options.yaml
          flutter gen-l10n
      - name: Build Windows release bundle
        shell: pwsh
        run: flutter build windows --release

  macos:
    name: macOS release build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Enable and materialize macOS runner
        run: |
          flutter config --enable-macos-desktop
          flutter create . --platforms=macos
      - name: Apply QuizForge macOS branding
        run: |
          python3 tool/generate_platform_branding.py --platforms=macos
          python3 tool/generate_platform_branding.py --platforms=macos --check
      - name: Resolve locked dependencies and localizations
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock analysis_options.yaml
          flutter gen-l10n
      - name: Build macOS release app
        run: flutter build macos --release

  ios:
    name: iOS no-codesign release compile
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Materialize iOS runner
        run: flutter create . --platforms=ios
      - name: Apply QuizForge iOS branding
        run: |
          python3 tool/generate_platform_branding.py --platforms=ios
          python3 tool/generate_platform_branding.py --platforms=ios --check
      - name: Resolve locked dependencies and localizations
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock analysis_options.yaml
          flutter gen-l10n
      - name: Compile iOS release app without signing
        run: flutter build ios --release --no-codesign
