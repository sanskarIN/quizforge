name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify tag matches pubspec version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          package_version="${package_version%%+*}"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Require committed application lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.lock
          git diff --exit-code -- pubspec.lock

      - name: Test repository validation tooling
        run: |
          python3 tool/test_check_markdown_links.py
          python3 tool/test_check_arb_catalogs.py
          python3 tool/test_check_release_metadata.py
          python3 tool/test_prepare_web_assets.py

      - name: Validate repository inputs
        run: |
          python3 tool/check_markdown_links.py
          python3 tool/check_arb_catalogs.py
          python3 tool/check_release_metadata.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify dependency resolution did not rewrite lockfile
        run: git diff --exit-code -- pubspec.lock

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

  android_web:
    name: Package Android and Web
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Generate Android and Web runners
        run: flutter create . --platforms=android,web
      - name: Prepare Drift Web runtime assets
        run: python3 tool/prepare_web_assets.py --destination web
      - name: Install locked dependencies and localizations
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter gen-l10n
      - name: Build Android release packages
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Build Web release bundle
        run: flutter build web --release
      - name: Verify packaged Drift Web runtime assets
        run: python3 tool/prepare_web_assets.py --destination build/web --check
      - name: Prepare Android and Web artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/quizforge-${GITHUB_REF_NAME}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release-artifacts/quizforge-${GITHUB_REF_NAME}-android.aab"
          tar -C build/web -czf "release-artifacts/quizforge-${GITHUB_REF_NAME}-web.tar.gz" .
      - name: Upload Android and Web artifacts
        uses: actions/upload-artifact@v7
        with:
          name: quizforge-release-android-web
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Package Linux
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Generate Linux runner
        run: |
          flutter config --enable-linux-desktop
          flutter create . --platforms=linux
      - name: Install locked dependencies and localizations
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter gen-l10n
      - name: Build Linux release bundle
        run: flutter build linux --release
      - name: Package Linux artifact
        run: |
          mkdir -p release-artifacts
          tar -C build/linux/x64/release/bundle -czf "release-artifacts/quizforge-${GITHUB_REF_NAME}-linux-x64.tar.gz" .
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: quizforge-release-linux
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Package Windows
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows
      - name: Install locked dependencies and localizations
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter gen-l10n
      - name: Build Windows release bundle
        shell: pwsh
        run: flutter build windows --release
      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "release-artifacts/quizforge-${{ github.ref_name }}-windows-x64.zip"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: quizforge-release-windows
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Package macOS
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Generate macOS runner
        run: |
          flutter config --enable-macos-desktop
          flutter create . --platforms=macos
      - name: Install locked dependencies and localizations
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter gen-l10n
      - name: Build macOS release app
        run: flutter build macos --release
      - name: Package macOS artifact
        run: |
          mkdir -p release-artifacts
          tar -C build/macos/Build/Products/Release -czf "release-artifacts/quizforge-${GITHUB_REF_NAME}-macos.tar.gz" .
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: quizforge-release-macos
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Compile iOS without signing
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Generate iOS runner
        run: flutter create . --platforms=ios
      - name: Install locked dependencies and localizations
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter gen-l10n
      - name: Compile iOS release app without signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS compile artifact
        run: |
          mkdir -p release-artifacts
          tar -C build/ios/iphoneos -czf "release-artifacts/quizforge-${GITHUB_REF_NAME}-ios-unsigned.tar.gz" Runner.app
      - name: Upload unsigned iOS compile artifact
        uses: actions/upload-artifact@v7
        with:
          name: quizforge-release-ios-unsigned
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified cross-platform release
    needs: [android_web, linux, windows, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: quizforge-release-*
          path: release-artifacts
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          test "$(find . -maxdepth 1 -type f | wc -l)" -ge 6
          sha256sum quizforge-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "QuizForge ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
