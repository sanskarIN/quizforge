name: OSV Vulnerability Scan

on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/osv-scan.yml
  pull_request:
    branches: [main]
    paths:
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/osv-scan.yml
  schedule:
    - cron: "17 23 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: OSV dependency scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: true
      upload-sarif: true
