name: Format Release Candidate

on:
  push:
    branches:
      - final/consolidated-release-audit-20260819

permissions:
  contents: write

concurrency:
  group: format-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'sanskarIN/quizforge' && github.ref == 'refs/heads/final/consolidated-release-audit-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release-candidate branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter toolchain
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Apply canonical Dart formatting
        run: dart format lib test tool

      - name: Commit tracked formatting changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib test tool; then
            echo "Tracked Dart sources are already formatted."
            exit 0
          fi

          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add -u -- lib test tool
          git commit -m "style: apply canonical Dart formatting"
          git push origin HEAD:final/consolidated-release-audit-20260819
