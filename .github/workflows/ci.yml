name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-fix:
    name: One-shot release-candidate formatter
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'final/consolidated-release-audit-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter toolchain
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Apply canonical Dart formatting
        run: dart format lib test tool

      - name: Commit tracked formatting changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib test tool; then
            echo "Tracked Dart sources are already formatted."
            exit 0
          fi

          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add -u -- lib test tool
          git commit -m "style: apply canonical Dart formatting"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test repository validation tooling
        run: |
          python3 tool/test_check_markdown_links.py
          python3 tool/test_check_arb_catalogs.py
          python3 tool/test_check_release_metadata.py
          python3 tool/test_prepare_web_assets.py

      - name: Validate repository-local Markdown links
        run: python3 tool/check_markdown_links.py

      - name: Validate ARB localization catalogs
        run: python3 tool/check_arb_catalogs.py

      - name: Validate release metadata
        run: python3 tool/check_release_metadata.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Preserve resolved lockfile evidence
        uses: actions/upload-artifact@v7
        with:
          name: pubspec-lock-${{ github.sha }}
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 7

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage
